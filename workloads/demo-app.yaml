# Demo app: a two-service request chain that the operator auto-instruments.
#
#   loadgen -> frontend (Flask) --GET--> backend (Flask, adds 0-50ms delay)
#
# Both Deployments carry the magic annotation; the operator's webhook
# injects the Python SDK init container + env at admission. No Dockerfile,
# no SDK code in the app repos - the whole point of the POC.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gap-demo
  labels:
    app.kubernetes.io/name: gap-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gap-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gap-frontend
      annotations:
        # THE auto-instrumentation annotation - operator webhook target.
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: frontend
          # >>> INSERT: your image - build from apps/ or use a public demo
          # image (e.g. us-central1-docker.pkg.dev/gcplearn9-498315/gitops-poc-apps/gap-demo-frontend:latest) <<<
          image: us-central1-docker.pkg.dev/gcplearn9-498315/gitops-poc-apps/gap-demo-frontend:latest
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_URL
              value: http://backend:8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gap-demo
spec:
  selector:
    app.kubernetes.io/name: gap-frontend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gap-demo
  labels:
    app.kubernetes.io/name: gap-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gap-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gap-backend
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: backend
          # >>> INSERT: your image (same build as frontend) <<<
          image: us-central1-docker.pkg.dev/gcplearn9-498315/gitops-poc-apps/gap-demo-backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gap-demo
spec:
  selector:
    app.kubernetes.io/name: gap-backend
  ports:
    - port: 8000
      targetPort: 8000
