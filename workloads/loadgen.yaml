# Load generator: drives the frontend with steady QPS so traces appear
# in Tempo and spanmetrics accumulate in Prometheus.
# Intentionally NOT auto-instrumented (no annotation) - it's a driver, not
# part of the traced system.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: gap-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          # Plain busybox + wget loop keeps the image tiny and avoids
          # needing a registry for the driver.
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://frontend:8000/ >/dev/null 2>&1
                sleep 0.2
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
